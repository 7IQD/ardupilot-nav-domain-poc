# NAV-DF / Drone-DF Canonical File Structure

A deterministic, flight-grade, DataFlash-centric layout for NAV refinement and DF pipelines.

| Directory / File                  | Short Purpose |
|----------------------------------|---------------|
| `bin/vault/df_source/`            | The Source: Authoritative .BIN logs (Input). |
| `bin/vault/vault_b/`              | The Ingest Staging: Transient `.parquet` shards (Auto-cleaned every run). |
| `bin/vault/warehouse_df/`         | The Engine Room: Final destination for structured navigation data. |
| ├── `nav_df_master.parquet`       | The Master Artifact: The consolidated, columnar analytical dataset. |
| └── `nav_df_vault.db`             | The Vault: DuckDB instance for high-speed SQL queries and forensic views. |
| `weaving/ingest_df/nav/`          | Logic Folder: NAV DFReader and processing pipeline. |
| ├── `nav_df_architect.py`         | DFReader extraction & staging logic for NAV domain. |
| ├── `nav_refinery.py`             | Refinement & transformation logic reusing NAV-PoC module. |
| ├── `clerk.py`                    | Orchestration/helper functions for processing & validation. |
| └── `__init__.py`                 | Makes the NAV folder a Python package. |
| `util/`                            | Shared utilities for all domains. |
| └── `nav_utils.py`                | Helpers for message → dict conversion, metadata, timestamps, etc. |
| `df_main.py`                        | The Orchestrator: Runs the 3-pass Waterfall (Purge vault_b → Shard → Merge). |
| `drone_df_ui.py`                  | The Schema Builder: Builds DuckDB views over the DF master for UI and analytics. |
| `logs/nav_analysis/`              | The Evidence Locker: Final forensic text reports and validation summaries. |
